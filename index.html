<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Plateforme marocaine de cartes de visite NFC haut de gamme et profils professionnels digitaux pour entrepreneurs, indépendants et dirigeants d'entreprise au Maroc." />
    <meta property="og:title" content="TAGTOP - Cartes de Visite NFC & Profils Professionnels au Maroc" />
    <meta property="og:description" content="Plateforme marocaine de cartes de visite NFC haut de gamme et profils professionnels digitaux pour entrepreneurs et dirigeants d'entreprise." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="%BASE_URL%assets/aistudio/TAGTOP_Logo_Website_Header_72804e46.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Pre-paint language and text direction detection (prevents layout flash) -->
    <script>
      (function() {
        try {
          var validLangs = ['ar', 'en', 'fr'];
          var lang = 'fr';
          var hasExplicitUrl = false;

          try {
            var params = new URLSearchParams(window.location.search);
            var urlLang = params.get('lang');
            if (urlLang && validLangs.indexOf(urlLang) !== -1) {
              lang = urlLang;
              hasExplicitUrl = true;
              try {
                localStorage.setItem('tagtop_lang', lang);
              } catch (e) {}
              // Clean stale lang parameter from URL to prevent overriding future manual choices
              try {
                params.delete('lang');
                var remaining = params.toString();
                var newSearch = remaining ? ('?' + remaining) : '';
                var newUrl = window.location.pathname + newSearch + window.location.hash;
                window.history.replaceState(null, '', newUrl);
              } catch (e) {}
            }
          } catch (e) {}

          if (!hasExplicitUrl) {
            try {
              var saved = localStorage.getItem('tagtop_lang');
              if (saved && validLangs.indexOf(saved) !== -1) {
                lang = saved;
              }
            } catch (e) {}
          }

          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (err) {}
      })();
    </script>
  </head>
  <body class="bg-white text-slate-800 antialiased selection:bg-[#FFD700] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
